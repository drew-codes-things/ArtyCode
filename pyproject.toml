[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arty-cli"
dynamic = ["version"]
description = "ArtyCode: a coding assistant in your terminal that reads, edits and runs code in the current folder, asking first. Runs on your own Arty."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
arty-cli = "arty_cli.cli:main"
arty = "arty_cli.cli:main"

[tool.setuptools]
packages = ["arty_cli"]

[tool.setuptools.dynamic]
version = { attr = "arty_cli.__version__" }
